name: Create and upload app bundles to Google Play

# The tag suffix picks the highest Google Play track; every lower test track gets the
# same build too, so testers on a lower track never lag behind a higher one:
#
#   v1.0.62-internal  -> internal                                (completed)
#   v1.0.62-alpha     -> alpha            + internal             (completed)   closed testing
#   v1.0.62-beta      -> beta             + internal, alpha      (completed)   open testing
#   v1.0.62           -> production       + internal, alpha, beta
#                        (draft, published by hand in the Play Console; the test tracks
#                        get it completed right away)
#
# The bundle is uploaded once, to the highest track; the lower tracks are then pointed
# at the same versionCode (what "promote release" does in the Play Console).
#
# Any other suffix (-rc, -Beta, a typo) fails the job rather than guessing a track.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
jobs:
  build:
    name: Build app bundles
    runs-on: ubuntu-latest
    outputs:
      track: ${{ steps.play.outputs.track }}
      status: ${{ steps.play.outputs.status }}
      lowerTracks: ${{ steps.play.outputs.lowerTracks }}
      versionCode: ${{ steps.play.outputs.versionCode }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Runs before the (slow) Gradle build, so a bad tag costs seconds not minutes.
      - name: Resolve Google Play track
        id: play
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            v*) ;;
            *) echo "::error::Not a version tag: '$TAG'. Run this on a v* tag." ; exit 1 ;;
          esac
          case "$TAG" in
            *-internal) track=internal;   status=completed; lower="" ;;
            *-alpha)    track=alpha;      status=completed; lower="internal" ;;
            *-beta)     track=beta;       status=completed; lower="internal alpha" ;;
            *-*)        echo "::error::Unrecognised suffix in '$TAG'. Use -internal, -alpha, -beta, or no suffix for production." ; exit 1 ;;
            *)          track=production; status=draft;     lower="internal alpha beta" ;;
          esac
          # Same source the Android modules read their versionCode from.
          versionCode="$(python3 -c 'import tomllib; print(tomllib.load(open("gradle/libs.versions.toml", "rb"))["versions"]["appBuildNumber"])')"
          echo "track=$track" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "lowerTracks=$lower" >> "$GITHUB_OUTPUT"
          echo "versionCode=$versionCode" >> "$GITHUB_OUTPUT"
          echo "$TAG -> track=$track status=$status lowerTracks=[${lower}] versionCode=$versionCode"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6.4.0

      - name: Prepare keystore
        run: echo "${{ secrets.android_keystore_base64 }}" | base64 -d > "$GITHUB_WORKSPACE/keystore.jks"

      - name: Verify keystore
        run: |
          ls -lh "$GITHUB_WORKSPACE/keystore.jks"
          keytool -list \
            -keystore "$GITHUB_WORKSPACE/keystore.jks" \
            -storepass "${{ secrets.android_keystore_password }}"

      - name: Build spectacled release app bundles (AAB) for Gplay
        run: ./gradlew androidJournalsApp:bundleRelease androidNotesApp:bundleRelease androidTasksApp:bundleRelease
        env:
          ANDROID_KEYSTORE: ${{ github.workspace }}/keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.android_keystore_password }}
          ANDROID_KEY_ALIAS_JOURNALS: ${{ secrets.android_key_alias_journals }}
          ANDROID_KEY_PASSWORD_JOURNALS: ${{ secrets.android_key_password_journals }}
          ANDROID_KEY_ALIAS_NOTES: ${{ secrets.android_key_alias_notes }}
          ANDROID_KEY_PASSWORD_NOTES: ${{ secrets.android_key_password_notes }}
          ANDROID_KEY_ALIAS_TASKS: ${{ secrets.android_key_alias_tasks }}
          ANDROID_KEY_PASSWORD_TASKS: ${{ secrets.android_key_password_tasks }}

      - name: Collect bundles & mapping files
        # Normalized to dist/<app>/, so the upload job below needs no per-app paths.
        # All three apps build with isMinifyEnabled = true; the mapping is looked up
        # rather than hardcoded so an AGP change to the output layout degrades to
        # "no mapping uploaded" instead of failing the release.
        run: |
          for pair in "journals:androidJournalsApp" "notes:androidNotesApp" "tasks:androidTasksApp"; do
            app="${pair%%:*}"
            module="${pair##*:}"
            mkdir -p "dist/$app"
            cp "$module/build/outputs/bundle/release/"*.aab "dist/$app/app.aab"
            mapping="$(find "$module/build/outputs/mapping" -name mapping.txt -type f 2>/dev/null | head -n 1 || true)"
            if [ -n "$mapping" ]; then cp "$mapping" "dist/$app/mapping.txt"; fi
            echo "$app: bundle=ok mapping=${mapping:-<none found>}"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: play-bundles
          path: dist/
          if-no-files-found: error

  upload:
    name: Upload ${{ matrix.app }} to Google Play (${{ needs.build.outputs.track }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      # One app's rejection must not cancel the other two.
      fail-fast: false
      matrix:
        include:
          - app: journals
            packageName: at.techbee.spectacled.journals
          - app: notes
            packageName: at.techbee.spectacled.notes
          - app: tasks
            packageName: at.techbee.spectacled.tasks
    steps:
      # No checkout: everything this job needs travels in the artifact.
      - uses: actions/download-artifact@v8
        with:
          name: play-bundles
          path: dist

      - name: Resolve mapping file
        id: mapping
        run: |
          file="dist/${{ matrix.app }}/mapping.txt"
          if [ -f "$file" ]; then
            echo "path=$file" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"   # the action skips an empty mappingFile
            echo "::warning::No mapping file for ${{ matrix.app }}; crash reports stay obfuscated."
          fi

      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.google_play_service_account_json }}
          packageName: ${{ matrix.packageName }}
          releaseFiles: dist/${{ matrix.app }}/app.aab
          mappingFile: ${{ steps.mapping.outputs.path }}
          track: ${{ needs.build.outputs.track }}
          status: ${{ needs.build.outputs.status }}

      # The bundle already exists on Play now, so the lower tracks only need to point at
      # its versionCode. All of them change in a single edit, so either every lower track
      # is updated or none is.
      - name: Roll out to lower test tracks (${{ needs.build.outputs.lowerTracks }})
        if: needs.build.outputs.lowerTracks != ''
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.google_play_service_account_json }}
          PACKAGE_NAME: ${{ matrix.packageName }}
          VERSION_CODE: ${{ needs.build.outputs.versionCode }}
          TRACKS: ${{ needs.build.outputs.lowerTracks }}
        run: |
          pip install --quiet google-auth requests
          python3 - <<'PY'
          import json, os
          from google.auth.transport.requests import AuthorizedSession
          from google.oauth2 import service_account

          creds = service_account.Credentials.from_service_account_info(
              json.loads(os.environ["SERVICE_ACCOUNT_JSON"]),
              scopes=["https://www.googleapis.com/auth/androidpublisher"],
          )
          session = AuthorizedSession(creds)
          base = f"https://androidpublisher.googleapis.com/androidpublisher/v3/applications/{os.environ['PACKAGE_NAME']}/edits"

          def call(method, url, **kwargs):
              r = session.request(method, url, **kwargs)
              if not r.ok:
                  raise SystemExit(f"::error::{method} {url} -> {r.status_code}: {r.text}")
              return r.json()

          edit = call("POST", base)["id"]
          for track in os.environ["TRACKS"].split():
              call("PUT", f"{base}/{edit}/tracks/{track}", json={
                  "track": track,
                  "releases": [{"versionCodes": [os.environ["VERSION_CODE"]], "status": "completed"}],
              })
              print(f"{track}: versionCode {os.environ['VERSION_CODE']} (completed)")
          call("POST", f"{base}/{edit}:commit")
          print("Edit committed.")
          PY
