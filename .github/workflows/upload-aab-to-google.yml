name: Create and upload app bundles to Google Play

# The tag suffix *is* the Google Play track:
#
#   v1.0.62-internal  -> internal    (completed)
#   v1.0.62-alpha     -> alpha       (completed)   closed testing
#   v1.0.62-beta      -> beta        (completed)   open testing
#   v1.0.62           -> production  (draft)       published by hand in the Play Console
#
# Any other suffix (-rc, -Beta, a typo) fails the job rather than guessing a track.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
jobs:
  build:
    name: Build app bundles
    runs-on: ubuntu-latest
    outputs:
      track: ${{ steps.play.outputs.track }}
      status: ${{ steps.play.outputs.status }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Runs before the (slow) Gradle build, so a bad tag costs seconds not minutes.
      - name: Resolve Google Play track
        id: play
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            v*) ;;
            *) echo "::error::Not a version tag: '$TAG'. Run this on a v* tag." ; exit 1 ;;
          esac
          case "$TAG" in
            *-internal) track=internal;   status=completed ;;
            *-alpha)    track=alpha;      status=completed ;;
            *-beta)     track=beta;       status=completed ;;
            *-*)        echo "::error::Unrecognised suffix in '$TAG'. Use -internal, -alpha, -beta, or no suffix for production." ; exit 1 ;;
            *)          track=production; status=draft ;;
          esac
          echo "track=$track" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "$TAG -> track=$track status=$status"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6.3.0

      - name: Prepare keystore
        run: echo "${{ secrets.android_keystore_base64 }}" | base64 -d > "$GITHUB_WORKSPACE/keystore.jks"

      - name: Verify keystore
        run: |
          ls -lh "$GITHUB_WORKSPACE/keystore.jks"
          keytool -list \
            -keystore "$GITHUB_WORKSPACE/keystore.jks" \
            -storepass "${{ secrets.android_keystore_password }}"

      - name: Build spectacled release app bundles (AAB) for Gplay
        run: ./gradlew androidJournalsApp:bundleRelease androidNotesApp:bundleRelease androidTasksApp:bundleRelease
        env:
          ANDROID_KEYSTORE: ${{ github.workspace }}/keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.android_keystore_password }}
          ANDROID_KEY_ALIAS_JOURNALS: ${{ secrets.android_key_alias_journals }}
          ANDROID_KEY_PASSWORD_JOURNALS: ${{ secrets.android_key_password_journals }}
          ANDROID_KEY_ALIAS_NOTES: ${{ secrets.android_key_alias_notes }}
          ANDROID_KEY_PASSWORD_NOTES: ${{ secrets.android_key_password_notes }}
          ANDROID_KEY_ALIAS_TASKS: ${{ secrets.android_key_alias_tasks }}
          ANDROID_KEY_PASSWORD_TASKS: ${{ secrets.android_key_password_tasks }}

      - name: Collect bundles & mapping files
        # Normalized to dist/<app>/, so the upload job below needs no per-app paths.
        # All three apps build with isMinifyEnabled = true; the mapping is looked up
        # rather than hardcoded so an AGP change to the output layout degrades to
        # "no mapping uploaded" instead of failing the release.
        run: |
          for pair in "journals:androidJournalsApp" "notes:androidNotesApp" "tasks:androidTasksApp"; do
            app="${pair%%:*}"
            module="${pair##*:}"
            mkdir -p "dist/$app"
            cp "$module/build/outputs/bundle/release/"*.aab "dist/$app/app.aab"
            mapping="$(find "$module/build/outputs/mapping" -name mapping.txt -type f 2>/dev/null | head -n 1 || true)"
            if [ -n "$mapping" ]; then cp "$mapping" "dist/$app/mapping.txt"; fi
            echo "$app: bundle=ok mapping=${mapping:-<none found>}"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: play-bundles
          path: dist/
          if-no-files-found: error

  upload:
    name: Upload ${{ matrix.app }} to Google Play (${{ needs.build.outputs.track }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      # One app's rejection must not cancel the other two.
      fail-fast: false
      matrix:
        include:
          - app: journals
            packageName: at.techbee.spectacled.journals
          - app: notes
            packageName: at.techbee.spectacled.notes
          - app: tasks
            packageName: at.techbee.spectacled.tasks
    steps:
      # No checkout: everything this job needs travels in the artifact.
      - uses: actions/download-artifact@v8
        with:
          name: play-bundles
          path: dist

      - name: Resolve mapping file
        id: mapping
        run: |
          file="dist/${{ matrix.app }}/mapping.txt"
          if [ -f "$file" ]; then
            echo "path=$file" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"   # the action skips an empty mappingFile
            echo "::warning::No mapping file for ${{ matrix.app }}; crash reports stay obfuscated."
          fi

      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.google_play_service_account_json }}
          packageName: ${{ matrix.packageName }}
          releaseFiles: dist/${{ matrix.app }}/app.aab
          mappingFile: ${{ steps.mapping.outputs.path }}
          track: ${{ needs.build.outputs.track }}
          status: ${{ needs.build.outputs.status }}
