name: Create GitHub release
on:
  push:
    tags:
      - 'v*beta*'      # betas  -> pre-release
      - 'v*'           # finals -> release
      - '!v*alpha*'    # alphas are handled by upload-aab-to-google.yml
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Prepare keystore
        run: echo "${{ secrets.android_keystore_base64 }}" | base64 -d > "$GITHUB_WORKSPACE/keystore.jks"

      - name: Build release APKs (Journals, Notes, Tasks)
        run: ./gradlew androidJournalsApp:assembleRelease androidNotesApp:assembleRelease androidTasksApp:assembleRelease
        env:
          ANDROID_KEYSTORE: ${{ github.workspace }}/keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.android_keystore_password }}
          ANDROID_KEY_ALIAS_JOURNALS: ${{ secrets.android_key_alias_journals }}
          ANDROID_KEY_PASSWORD_JOURNALS: ${{ secrets.android_key_password_journals }}
          ANDROID_KEY_ALIAS_NOTES: ${{ secrets.android_key_alias_notes }}
          ANDROID_KEY_PASSWORD_NOTES: ${{ secrets.android_key_password_notes }}
          ANDROID_KEY_ALIAS_TASKS: ${{ secrets.android_key_alias_tasks }}
          ANDROID_KEY_PASSWORD_TASKS: ${{ secrets.android_key_password_tasks }}

      - name: Collect & rename APKs
        run: |
          mkdir -p dist
          cp androidJournalsApp/build/outputs/apk/release/*.apk dist/spectacled-journals-${{ github.ref_name }}.apk
          cp androidNotesApp/build/outputs/apk/release/*.apk    dist/spectacled-notes-${{ github.ref_name }}.apk
          cp androidTasksApp/build/outputs/apk/release/*.apk     dist/spectacled-tasks-${{ github.ref_name }}.apk

      - uses: actions/upload-artifact@v7
        with:
          name: android-apks
          path: dist/*.apk
          if-no-files-found: error

  build-desktop:
    name: Build desktop installers (${{ matrix.format }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            task: packageDeb
            format: deb
          - os: windows-latest
            task: packageMsi
            format: msi
          - os: macos-latest
            task: packageDmg
            format: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Build ${{ matrix.format }} installers (Journals, Notes, Tasks)
        shell: bash
        run: ./gradlew composeJournalsApp:${{ matrix.task }} composeNotesApp:${{ matrix.task }} composeTasksApp:${{ matrix.task }}

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist
          cp compose*App/build/compose/binaries/main/${{ matrix.format }}/* dist/

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.format }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [build-android, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          # Betas (and release candidates) are published as pre-releases; final tags as full releases.
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
