name: Upload iOS apps to App Store Connect
on:
  push:
    tags:
      - 'v*beta*'      # betas  -> TestFlight
      - 'v*'           # finals -> TestFlight (promote to the App Store from ASC)
      - '!v*alpha*'
  workflow_dispatch:

# Values read straight from the Xcode configs (iosApp/ios*App/Configuration/Config.xcconfig):
#   Team ID:    BZY8AT5K2W   (same for all three apps)
#   Bundle IDs: at.techbee.spectacled.{journals,notes,tasks}
#
# Signing is MANUAL. We import a single reusable "Apple Distribution" certificate and the
# per-app "App Store" provisioning profile into a throwaway keychain, then sign directly
# for distribution. This deliberately avoids automatic signing + -allowProvisioningUpdates:
# on ephemeral CI runners that flow re-creates a Development certificate every run, which
# eventually trips Apple's certificate cap ("You already have a current Development
# certificate" / "Your account has reached the maximum number of certificates").
#
# Required repository secrets (in addition to the existing asc_api_key_* used for upload):
#   ios_dist_cert_p12_base64   base64 of the Apple Distribution cert exported from
#                              Keychain Access as .p12 (must include the private key)
#   ios_dist_cert_password     the password set when exporting that .p12
#   ios_profile_journals_base64 \
#   ios_profile_notes_base64     > base64 of each app's App Store .mobileprovision profile
#   ios_profile_tasks_base64   /
# Create the secrets with e.g.:  base64 -i dist_cert.p12 | pbcopy
# The certificate is shared by all three apps; each app needs its own App Store profile.

jobs:
  ios:
    name: Build & upload ${{ matrix.scheme }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: iosJournalsApp
            project: iosApp/iosJournalsApp/iosJournalsApp.xcodeproj
          - scheme: iosNotesApp
            project: iosApp/iosNotesApp/iosNotesApp.xcodeproj
          - scheme: iosTasksApp
            project: iosApp/iosTasksApp/iosTasksApp.xcodeproj
    env:
      TEAM_ID: BZY8AT5K2W
      ASC_KEY_ID: ${{ secrets.asc_api_key_id }}
      ASC_ISSUER_ID: ${{ secrets.asc_api_key_issuer_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Needed by the Xcode Run Script phase that runs
      # ./gradlew :composeXApp:embedAndSignAppleFrameworkForXcode
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6.3.0

      - name: Prepare App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo -n "${{ secrets.asc_api_key_p8_base64 }}" | base64 --decode \
            > "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Import signing certificate & provisioning profile
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.ios_dist_cert_p12_base64 }}
          DIST_CERT_PASSWORD: ${{ secrets.ios_dist_cert_password }}
          # All three are referenced statically here; the matching one is picked below.
          PROFILE_JOURNALS_BASE64: ${{ secrets.ios_profile_journals_base64 }}
          PROFILE_NOTES_BASE64: ${{ secrets.ios_profile_notes_base64 }}
          PROFILE_TASKS_BASE64: ${{ secrets.ios_profile_tasks_base64 }}
        run: |
          set -euo pipefail

          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/dist_cert.p12"

          # --- distribution certificate -> throwaway keychain ---
          echo -n "$DIST_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$DIST_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          # Let codesign use the imported key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Put our keychain on the search list (keep the existing ones too).
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed 's/["[:space:]]//g')

          # --- pick this app's App Store profile ---
          case "${{ matrix.scheme }}" in
            iosJournalsApp) PROFILE_BASE64="$PROFILE_JOURNALS_BASE64" ;;
            iosNotesApp)    PROFILE_BASE64="$PROFILE_NOTES_BASE64" ;;
            iosTasksApp)    PROFILE_BASE64="$PROFILE_TASKS_BASE64" ;;
            *) echo "::error::Unknown scheme ${{ matrix.scheme }}"; exit 1 ;;
          esac
          if [ -z "$PROFILE_BASE64" ]; then
            echo "::error::Missing provisioning-profile secret for ${{ matrix.scheme }}"
            exit 1
          fi

          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          PLIST="$RUNNER_TEMP/profile.plist"
          echo -n "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          # Decode the CMS-signed profile to read its metadata.
          security cms -D -i "$PROFILE_PATH" > "$PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PLIST")
          APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$PLIST")
          BUNDLE_ID="${APP_ID#*.}"   # strip the leading TEAMID.

          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          cp "$PROFILE_PATH" "$PROFILES_DIR/$PROFILE_UUID.mobileprovision"

          echo "Installed profile '$PROFILE_NAME' ($PROFILE_UUID) for $BUNDLE_ID"

          # Hand these to the archive/export steps.
          {
            echo "KEYCHAIN=$KEYCHAIN"
            echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD"
            echo "PROFILE_NAME=$PROFILE_NAME"
            echo "BUNDLE_ID=$BUNDLE_ID"
          } >> "$GITHUB_ENV"

      - name: Archive
        run: |
          xcodebuild \
            -project "${{ matrix.project }}" \
            -scheme "${{ matrix.scheme }}" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/${{ matrix.scheme }}.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            archive

      - name: Export & upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>upload</string>
              <key>teamID</key>
              <string>${TEAM_ID}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PROFILE_NAME}</string>
              </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/${{ matrix.scheme }}.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
