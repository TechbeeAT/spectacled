name: Upload iOS apps to App Store Connect
on:
  push:
    tags:
      - 'v*beta*'      # betas  -> TestFlight
      - 'v*'           # finals -> TestFlight (promote to the App Store from ASC)
      - '!v*alpha*'
  workflow_dispatch:

# Values read straight from the Xcode configs (iosApp/ios*App/Configuration/Config.xcconfig):
#   Team ID:    BZY8AT5K2W   (same for all three apps)
#   Bundle IDs: at.techbee.spectacled.{journals,notes,tasks}
#
# Signing stays AUTOMATIC, but we pre-import the Apple Distribution certificate into a
# throwaway keychain first. That is the part that was missing before:
#
#   Xcode's automatic signing only creates a NEW certificate when it cannot find a usable
#   one in the keychain. GitHub runners start with an empty keychain, so every run minted
#   a fresh certificate until the account hit Apple's cap ("You already have a current
#   Development certificate" -> "Your account has reached the maximum number of
#   certificates").
#
# Certificates are capped; provisioning profiles are not. So we supply the certificate
# ourselves (one reusable cert, stored as a secret) and still let
# -allowProvisioningUpdates create/refresh the App Store profiles automatically.
#
# Required repository secrets (in addition to the existing asc_api_key_* used for upload):
#   ios_dist_cert_p12_base64   base64 of the Apple Distribution cert exported from
#                              Keychain Access as .p12 (must include the private key)
#   ios_dist_cert_password     the password set when exporting that .p12
# Create with:  base64 -i dist_cert.p12 | pbcopy
# The one certificate is shared by all three apps.

jobs:
  ios:
    name: Build & upload ${{ matrix.scheme }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: iosJournalsApp
            project: iosApp/iosJournalsApp/iosJournalsApp.xcodeproj
          - scheme: iosNotesApp
            project: iosApp/iosNotesApp/iosNotesApp.xcodeproj
          - scheme: iosTasksApp
            project: iosApp/iosTasksApp/iosTasksApp.xcodeproj
    env:
      TEAM_ID: BZY8AT5K2W
      ASC_KEY_ID: ${{ secrets.asc_api_key_id }}
      ASC_ISSUER_ID: ${{ secrets.asc_api_key_issuer_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Needed by the Xcode Run Script phase that runs
      # ./gradlew :composeXApp:embedAndSignAppleFrameworkForXcode
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6.3.0

      - name: Prepare App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo -n "${{ secrets.asc_api_key_p8_base64 }}" | base64 --decode \
            > "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Import signing certificate
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.ios_dist_cert_p12_base64 }}
          DIST_CERT_PASSWORD: ${{ secrets.ios_dist_cert_password }}
        run: |
          set -euo pipefail

          if [ -z "$DIST_CERT_P12_BASE64" ]; then
            echo "::error::Missing secret ios_dist_cert_p12_base64"
            exit 1
          fi

          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/dist_cert.p12"

          echo -n "$DIST_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$DIST_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          # Let codesign use the imported key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Put our keychain on the search list, keeping the existing ones.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed 's/["[:space:]]//g')

          echo "Codesigning identities visible to Xcode:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Archive
        run: |
          xcodebuild \
            -project "${{ matrix.project }}" \
            -scheme "${{ matrix.scheme }}" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/${{ matrix.scheme }}.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive

      - name: Export & upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>upload</string>
              <key>teamID</key>
              <string>${TEAM_ID}</string>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/${{ matrix.scheme }}.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
